<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUROSHI — аниме без границ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0a12;
    --bg-soft: #15121f;
    --surface: #1b1728;
    --surface-2: #221c33;
    --line: rgba(168,140,255,0.14);
    --violet: #8b5cf6;
    --violet-2: #b18aff;
    --magenta: #d68bff;
    --text: #f1ecfb;
    --text-dim: #a99fc2;
    --text-faint: #6f6688;
    --shadow-glow: 0 0 60px rgba(139,92,246,0.35);
    --card-grad: linear-gradient(155deg,#241c39,#150f22 60%);
    --radius: 14px;
    --overlay: rgba(6,4,14,0.72);
  }

  html[data-theme="light"]{
    --bg: #f6f3fb;
    --bg-soft: #eee8fa;
    --surface: #ffffff;
    --surface-2: #f1ecfb;
    --line: rgba(90,50,160,0.12);
    --violet: #7c3aed;
    --violet-2: #6d28d9;
    --magenta: #a855f7;
    --text: #1c1428;
    --text-dim: #5c5270;
    --text-faint: #928aa8;
    --shadow-glow: 0 0 40px rgba(124,58,237,0.18);
    --card-grad: linear-gradient(155deg,#ffffff,#f2edfb 60%);
    --overlay: rgba(240,236,250,0.72);
  }

  html[data-theme="mono"]{
    --bg: #000000;
    --bg-soft: #0a0a0a;
    --surface: #111111;
    --surface-2: #161616;
    --line: rgba(255,255,255,0.12);
    --violet: #e5e5e5;
    --violet-2: #ffffff;
    --magenta: #9a9a9a;
    --text: #f2f2f2;
    --text-dim: #8f8f8f;
    --text-faint: #5a5a5a;
    --shadow-glow: 0 0 40px rgba(255,255,255,0.08);
    --card-grad: linear-gradient(155deg,#161616,#0c0c0c 60%);
    --overlay: rgba(0,0,0,0.8);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,92,246,0.22), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(214,139,255,0.14), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    transition: background 0.5s ease, color 0.5s ease;
    overflow-x:hidden;
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(124,58,237,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(168,85,247,0.08), transparent 55%),
      var(--bg);
  }
  html[data-theme="mono"] body{ background: var(--bg); }

  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 32px;}
  .hidden{display:none !important;}

  /* ===== NAV ===== */
  header{
    position:sticky; top:0; z-index:50;
    backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; max-width:1240px; margin:0 auto; gap:20px;
  }
  .logo{display:flex; align-items:center; gap:12px; cursor:pointer; background:none; border:none;}
  .logo-mark{
    font-family:'Bebas Neue', sans-serif;
    font-size:30px; letter-spacing:2px;
    background: linear-gradient(120deg, var(--violet-2), var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo-jp{
    font-family:'Noto Serif JP', serif; font-size:12px; color:var(--text-faint);
    writing-mode: vertical-rl; letter-spacing:2px;
  }
  .nav-links{display:flex; align-items:center; gap:30px; font-size:14.5px; font-weight:600; color:var(--text-dim);}
  .nav-links button{
    position:relative; padding:6px 0; transition:color .25s; background:none; border:none;
    color:inherit; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .nav-links button:hover, .nav-links button.active{color:var(--text);}
  .nav-links button.schedule-link{padding:8px 13px; border:1px solid var(--line); border-radius:9px; color:var(--text-dim); background:var(--surface);}
  .nav-links button.schedule-link:hover{border-color:var(--violet); color:var(--text); background:var(--surface-2);}
  .nav-links button.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-4px; height:2px;
    background:linear-gradient(90deg,var(--violet),var(--magenta)); border-radius:2px;
  }
  .profile-save-btn{transition:transform .15s, opacity .2s, filter .2s;}
  .profile-save-btn:active{transform:scale(.97);}
  .profile-save-btn:disabled{cursor:default;opacity:.8;filter:saturate(.8);}
  .nav-right{display:flex; align-items:center; gap:14px;}
  .auth-submit.save-loading{pointer-events:none;opacity:.78;transform:scale(.98);}
  .auth-submit.save-loading::after{content:' ✓';}
  .avatar-option.selected{outline:2px solid var(--violet);outline-offset:2px;transform:scale(1.04);}

  .search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:9px 16px; color:var(--text-faint); font-size:13.5px; min-width:200px;
  }
  .search input{background:none; border:none; outline:none; color:var(--text); font-family:inherit; font-size:13.5px; width:100%;}
  .theme-toggle{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px;
  }
  .theme-btn{
    width:32px; height:32px; border-radius:999px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text-faint); transition:all .25s;
  }
  .theme-btn.active{ background:linear-gradient(135deg,var(--violet),var(--magenta)); color:#fff; }
  html[data-theme="mono"] .theme-btn.active{ color:#000; }
  .theme-btn svg{width:16px; height:16px;}

  .auth-buttons{display:flex; align-items:center; gap:10px;}
  .btn-login{
    background:none; border:1px solid var(--line); color:var(--text); font-weight:700; font-size:13.5px;
    padding:10px 18px; border-radius:9px; cursor:pointer; transition:border-color .25s;
  }
  .btn-login:hover{border-color:var(--violet);}
  .btn-signup{
    background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff; font-weight:700; font-size:13.5px;
    padding:10px 18px; border-radius:9px; border:none; cursor:pointer; box-shadow:var(--shadow-glow); transition:transform .25s;
  }
  html[data-theme="mono"] .btn-signup{ color:#000; }
  .btn-signup:hover{transform:translateY(-2px);}
  .avatar-chip{
    display:none; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:6px 14px 6px 6px; cursor:pointer; font-size:13px; font-weight:700;
  }
  .avatar-chip .circle{
    width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--magenta));
    display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;
  }
  html[data-theme="mono"] .avatar-chip .circle{ color:#000; }

  /* ===== HERO ===== */
  .hero{position:relative; padding:64px 32px 40px; max-width:1240px; margin:0 auto; overflow:visible;}
  .hero-inner{position:relative; display:grid; grid-template-columns:1.15fr 0.85fr; gap:40px; align-items:center;}
  .brushstroke{
    position:absolute; top:-120px; left:-160px; width:640px; height:640px; z-index:0;
    background: conic-gradient(from 210deg, rgba(139,92,246,0.5), rgba(214,139,255,0.0) 40%);
    filter: blur(50px); opacity:.55; border-radius:50%;
    animation: drift 12s ease-in-out infinite alternate;
  }
  html[data-theme="mono"] .brushstroke{ background: conic-gradient(from 210deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 40%); }
  @keyframes drift{ from{transform:translate(0,0) scale(1);} to{transform:translate(30px,20px) scale(1.08);} }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--violet-2);
    margin-bottom:18px; position:relative; z-index:1;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--magenta); box-shadow:0 0 10px var(--magenta);}
  h1.title{
    position:relative; z-index:1;
    font-family:'Bebas Neue', sans-serif; font-size:76px; line-height:0.92; letter-spacing:1px;
    text-shadow: 0 0 40px rgba(139,92,246,0.35);
  }
  html[data-theme="light"] h1.title, html[data-theme="mono"] h1.title{ text-shadow:none; }
  .hero-desc{position:relative; z-index:1; margin-top:20px; color:var(--text-dim); font-size:15.5px; max-width:480px; line-height:1.65;}
  .hero-meta{position:relative; z-index:1; display:flex; gap:22px; margin-top:20px; font-size:13.5px; color:var(--text-faint); font-weight:600;}
  .hero-meta span{display:flex; align-items:center; gap:6px;}
  .hero-actions{position:relative; z-index:1; display:flex; gap:14px; margin-top:32px;}
  .btn-primary{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff; font-weight:700; font-size:14.5px;
    padding:14px 28px; border-radius:10px; border:none; cursor:pointer;
    box-shadow: var(--shadow-glow); transition:transform .25s;
  }
  html[data-theme="mono"] .btn-primary{ color:#000; }
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); color:var(--text); font-weight:700; font-size:14.5px;
    padding:14px 24px; border-radius:10px; cursor:pointer; transition:border-color .25s;
  }
  .btn-ghost:hover{border-color:var(--violet);}

  .hero-card{
    position:relative; z-index:1; aspect-ratio:3/4; border-radius:20px;
    background: var(--card-grad); border:1px solid var(--line); overflow:hidden;
    display:flex; align-items:flex-end; padding:22px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }
  .hero-card .art{position:absolute; inset:0;}
  .ep-badge{
    position:relative; z-index:2; background:rgba(0,0,0,0.45); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.15); border-radius:10px; padding:12px 16px; font-size:13px; font-weight:700;
  }

  /* ===== SECTIONS ===== */
  section{padding:52px 32px; max-width:1240px; margin:0 auto;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px;}
  .section-head h2{font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px;}
  .section-head .num{font-family:'Noto Serif JP',serif; font-size:12px; color:var(--text-faint); margin-left:10px;}
  .see-all{font-size:13px; font-weight:700; color:var(--violet-2); background:none; border:none; cursor:pointer; font-family:inherit;}

  .chips{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px;}
  .chip{
    padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); color:var(--text-dim); transition:all .25s;
  }
  .chip.active{background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff; border-color:transparent;}
  html[data-theme="mono"] .chip.active{color:#000;}

  .grid{display:grid; grid-template-columns:repeat(5,1fr); gap:20px;}
  .card{
    background:var(--card-grad); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; cursor:pointer; transition:transform .3s ease, box-shadow .3s ease;
  }
  .card:hover{transform:translateY(-6px); box-shadow:0 20px 40px rgba(139,92,246,0.25);}
  .card .art{aspect-ratio:2/3; position:relative; overflow:hidden;}
  .card .rating{
    position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);
    padding:4px 8px; border-radius:6px; font-size:11.5px; font-weight:800; display:flex; align-items:center; gap:4px;
  }
  .card .tag{
    position:absolute; top:10px; left:10px; background:linear-gradient(120deg,var(--violet),var(--magenta));
    padding:4px 9px; border-radius:6px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
  }
  html[data-theme="mono"] .card .tag{ color:#000; }
  .card .info{padding:14px;}
  .card .info h3{font-size:14.5px; font-weight:700; margin-bottom:6px; line-height:1.3;}
  .card .info p{font-size:12px; color:var(--text-faint);}

  /* continue watching */
  .cw-list{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
  .cw-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column; transition:border-color .25s;
  }
  .cw-card:hover{border-color:var(--violet);}
  .cw-thumb{aspect-ratio:16/9; position:relative;}
  .cw-thumb .play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.25); opacity:0; transition:opacity .25s;
  }
  .cw-card:hover .cw-thumb .play{opacity:1;}
  .cw-thumb .play svg{width:40px; height:40px; filter:drop-shadow(0 0 10px rgba(0,0,0,0.6));}
  .cw-body{padding:12px 14px;}
  .cw-body h4{font-size:13.5px; font-weight:700; margin-bottom:4px;}
  .cw-body span{font-size:11.5px; color:var(--text-faint);}
  .progress{height:4px; background:var(--surface-2); border-radius:4px; margin-top:10px; overflow:hidden;}
  .progress i{display:block; height:100%; background:linear-gradient(90deg,var(--violet),var(--magenta));}

  /* ===== CATALOG PAGE ===== */
  .catalog-head{padding:44px 32px 0; max-width:1240px; margin:0 auto;}
  .catalog-head h1{font-family:'Bebas Neue',sans-serif; font-size:44px; letter-spacing:1px;}
  .catalog-head p{color:var(--text-dim); font-size:14.5px; margin-top:8px;}

  .catalog-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:26px 32px; max-width:1240px; margin:0 auto;
  }
  .toolbar-left{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .btn-filter{
    display:flex; align-items:center; gap:9px;
    background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff; font-weight:700; font-size:13.5px;
    padding:11px 20px; border-radius:10px; border:none; cursor:pointer; box-shadow:var(--shadow-glow);
  }
  html[data-theme="mono"] .btn-filter{ color:#000; }
  .filter-count{
    background:rgba(255,255,255,0.25); border-radius:999px; padding:1px 8px; font-size:11.5px;
  }
  .sort-select{
    background:var(--surface); border:1px solid var(--line); color:var(--text); font-weight:600; font-size:13px;
    padding:11px 14px; border-radius:10px; cursor:pointer; font-family:inherit;
  }
  .result-count{font-size:13px; color:var(--text-faint); font-weight:600;}
  .active-filters{display:flex; gap:8px; flex-wrap:wrap; padding:0 32px 10px; max-width:1240px; margin:0 auto;}
  .active-filter-tag{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--violet);
    color:var(--violet-2); font-size:12px; font-weight:700; padding:6px 10px 6px 12px; border-radius:999px;
  }
  .active-filter-tag button{background:none; border:none; color:inherit; cursor:pointer; font-size:14px; line-height:1;}

  /* footer */
  footer{border-top:1px solid var(--line); padding:40px 32px; margin-top:20px;}
  .footer-inner{max-width:1240px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;}
  footer p{font-size:12.5px; color:var(--text-faint);}
  .footer-links{display:flex; gap:22px; font-size:12.5px; font-weight:600; color:var(--text-dim);}

  .art svg{width:100%; height:100%; display:block;}

  /* ===== MODALS (auth + filter) ===== */
  .overlay{
    position:fixed; inset:0; background:var(--overlay); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:18px; width:100%;
    box-shadow:0 30px 80px rgba(0,0,0,0.5); position:relative; max-height:88vh; overflow-y:auto;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
    background:var(--surface-2); border:none; color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }

  /* auth modal */
  #auth-modal .modal{max-width:400px; padding:34px 30px 30px;}
  .auth-tabs{display:flex; background:var(--surface-2); border-radius:10px; padding:4px; margin-bottom:24px;}
  .auth-tab{
    flex:1; text-align:center; padding:10px; border-radius:8px; font-weight:700; font-size:13.5px;
    background:none; border:none; color:var(--text-faint); cursor:pointer;
  }
  .auth-tab.active{background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff;}
  html[data-theme="mono"] .auth-tab.active{color:#000;}
  .auth-title{font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; margin-bottom:6px;}
  .auth-sub{font-size:13px; color:var(--text-faint); margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
  .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; color:var(--text); font-size:13.5px; font-family:inherit; outline:none; transition:border-color .2s;
  }
  .field input:focus{border-color:var(--violet);}
  .auth-submit{
    width:100%; background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff; font-weight:700;
    font-size:14px; padding:13px; border-radius:9px; border:none; cursor:pointer; margin-top:6px; box-shadow:var(--shadow-glow);
  }
  html[data-theme="mono"] .auth-submit{color:#000;}
  .auth-switch{text-align:center; font-size:12.5px; color:var(--text-faint); margin-top:18px;}
  .auth-switch button{background:none; border:none; color:var(--violet-2); font-weight:700; cursor:pointer; font-family:inherit;}
  .auth-note{font-size:11px; color:var(--text-faint); text-align:center; margin-top:14px; line-height:1.5;}

  /* filter modal */
  #filter-modal .modal{max-width:640px; padding:30px 32px;}
  .filter-title{font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; margin-bottom:24px;}
  .filter-group{margin-bottom:24px;}
  .filter-group h4{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); margin-bottom:12px;}
  .filter-chip-row{display:flex; flex-wrap:wrap; gap:9px;}
  .f-chip{
    padding:8px 15px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); transition:all .2s;
  }
  .f-chip.selected{background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff; border-color:transparent;}
  html[data-theme="mono"] .f-chip.selected{color:#000;}
  .filter-footer{
    display:flex; justify-content:space-between; align-items:center; margin-top:10px;
    padding-top:20px; border-top:1px solid var(--line);
  }
  .btn-reset{background:none; border:none; color:var(--text-faint); font-weight:700; font-size:13px; cursor:pointer;}
  .btn-apply{
    background:linear-gradient(120deg,var(--violet),var(--magenta)); color:#fff; font-weight:700; font-size:13.5px;
    padding:12px 26px; border-radius:9px; border:none; cursor:pointer; box-shadow:var(--shadow-glow);
  }
  html[data-theme="mono"] .btn-apply{color:#000;}

  .toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px); z-index:200;
    background:var(--surface); border:1px solid var(--violet); color:var(--text); font-size:13.5px; font-weight:600;
    padding:14px 22px; border-radius:12px; box-shadow:0 20px 40px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition:all .3s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}


  /* ===== PROFILE / LIBRARY ===== */
  .profile-page{padding-top:34px!important;}
  .profile-cover{height:150px;border-radius:20px;background:radial-gradient(circle at 20% 20%,rgba(214,139,255,.5),transparent 35%),linear-gradient(120deg,#201638,#100c19);border:1px solid var(--line);}
  .profile-head{display:flex;align-items:center;gap:22px;margin:-45px 0 35px;padding:0 28px;position:relative;}

<script>
/* KUROSHI v32 — clean admin catalog/editor */
(function(){
  const $=(id)=>document.getElementById(id);
  const root=()=>document.querySelector('#profile-modal.k-admin-open .profile-content');
  const field=(id)=>{
    const r=root();
    return r ? r.querySelector('#'+CSS.escape(id)) : null;
  };
  const val=(id)=>String(field(id)?.value??'').trim();
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

  async function isAdmin(){
    try{
      const {data,error}=await window.sb.rpc('is_admin');
      return !error && data===true;
    }catch(e){return false;}
  }

  async function renderList(){
    const box=$('k32-list'), st=$('k32-status');
    if(!box)return;
    st.textContent='Загрузка…';
    box.innerHTML='';
    if(!(await isAdmin())){st.textContent='Нет доступа';return;}
    const {data,error}=await sb.from('anime').select('id,title,genre,year,status,poster,rating,total_episodes').order('updated_at',{ascending:false});
    if(error){st.textContent='Ошибка: '+error.message;return;}
    const q=($('k32-search')?.value||'').trim().toLowerCase();
    const rows=(data||[]).filter(x=>!q||String(x.title||'').toLowerCase().includes(q));
    st.textContent='В каталоге: '+rows.length;
    if(!rows.length){box.innerHTML='<div style="padding:22px;text-align:center;color:var(--text-faint)">Аниме в каталоге пока нет.</div>';return;}
    box.innerHTML=rows.map(x=>`
      <div class="k32-row" data-id="${esc(x.id)}">
        ${x.poster?`<img class="k32-poster" src="${esc(x.poster)}" referrerpolicy="no-referrer" alt="">`:'<div class="k32-poster"></div>'}
        <div>
          <strong>${esc(x.title)}</strong>
          <small>ID: ${esc(x.id)}</small>
          <small>${esc(x.genre||'')} · ${esc(x.year||'')} · ${esc(x.status||'')} · ★ ${Number(x.rating||0).toFixed(1)}</small>
        </div>
        <div class="k32-actions">
          <button type="button" data-k32-edit="${esc(x.id)}">Изменить</button>
          <button type="button" class="danger" data-k32-delete="${esc(x.id)}">Удалить</button>
        </div>
      </div>`).join('');
  }

  async function editAnime(id){
    const {data,error}=await sb.from('anime').select('*').eq('id',id).maybeSingle();
    if(error||!data){showToast(error?.message||'Аниме не найдено');return;}
    const set=(id,v)=>{const e=field(id);if(e)e.value=v??''};
    set('admin-anime-id',data.id);set('admin-anime-title',data.title);set('admin-anime-genre',data.genre);
    set('admin-anime-year',data.year);set('admin-anime-status',data.status);set('admin-anime-poster',data.poster);
    set('admin-anime-description',data.description);set('admin-anime-rating',0);
    const s=$('k32-save-status');if(s)s.textContent='Изменения загружены — нажмите «Сохранить».';
  }

  async function deleteAnime(id){
    if(!(await isAdmin()))return showToast('Нет доступа');
    const {data}=await sb.from('anime').select('title').eq('id',id).maybeSingle();
    if(!confirm(`Удалить «${data?.title||id}» из каталога?`))return;
    const {error}=await sb.from('anime').delete().eq('id',id);
    if(error){showToast(error.message);return;}
    await renderList();
    if(window.refreshKuroshiCatalog)await window.refreshKuroshiCatalog();
    showToast('Аниме удалено ✓');
  }

  async function saveAnime(){
    const st=$('k32-save-status');
    if(!(await isAdmin())){if(st)st.textContent='Нет доступа';return;}
    const id=val('admin-anime-id'), title=val('admin-anime-title');
    if(!id||!title){if(st)st.textContent='Заполните ID и название.';return;}
    const row={
      id,title,
      genre:val('admin-anime-genre'),
      year:Number(field('admin-anime-year')?.value)||null,
      status:val('admin-anime-status'),
      poster:val('admin-anime-poster'),
      description:val('admin-anime-description'),
      tags:[],
      total_episodes:Number(field('admin-anime-episodes')?.value)||null,
      rating:0
    };
    if(st)st.textContent='Сохраняем…';
    const {error}=await sb.from('anime').upsert(row,{onConflict:'id'});
    if(error){
      if(st)st.textContent='Ошибка: '+error.message;
      return;
    }
    if(st)st.textContent='Сохранено ✓';
    await renderList();
    if(window.refreshKuroshiCatalog)await window.refreshKuroshiCatalog();
    showToast('Аниме сохранено ✓');
  }

  function installAdminUI(){
    const r=root();
    if(!r)return;
    if(r.querySelector('#k32-manager')){bindSave();return;}

    const shell=r.querySelector('.k12-admin-shell')||r;
    const tabs=shell.querySelector('.k10-admin-tabs');
    const manager=document.createElement('div');
    manager.id='k32-manager';
    manager.className='k32-catalog';
    manager.innerHTML=`
      <div class="k32-catalog-head">
        <strong>Все аниме в каталоге</strong>
        <input id="k32-search" class="k32-search" placeholder="Поиск по названию...">
      </div>
      <div id="k32-status" class="k32-save-status">Загрузка каталога…</div>
      <div id="k32-list" class="k32-list"></div>`;
    shell.insertBefore(manager,tabs||shell.firstChild);

    const animeCard=r.querySelector('#admin-anime-title')?.closest('.admin-card');
    if(animeCard && !animeCard.querySelector('#k32-save-status')){
      const st=document.createElement('div');
      st.id='k32-save-status';
      st.className='k32-save-status';
      st.textContent='';
      animeCard.querySelector('.admin-row')?.after(st);

      // Replace the Save button itself — no old onclick/listeners remain.
      const old=[...animeCard.querySelectorAll('button')].find(b=>b.textContent.trim()==='Сохранить');
      if(old){
        const btn=old.cloneNode(true);
        btn.type='button';
        btn.removeAttribute('onclick');
        btn.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();saveAnime();});
        old.replaceWith(btn);
      }
    }
    $('k32-search')?.addEventListener('input',renderList);
    r.addEventListener('click',function(e){
      const edit=e.target.closest?.('[data-k32-edit]');
      const del=e.target.closest?.('[data-k32-delete]');
      if(edit){e.preventDefault();editAnime(edit.dataset.k32Edit);}
      if(del){e.preventDefault();deleteAnime(del.dataset.k32Delete);}
    });
    renderList();
  }

  function bindSave(){
    const r=root();if(!r)return;
    const card=field('admin-anime-title')?.closest('.admin-card');if(!card)return;
    const old=[...card.querySelectorAll('button')].find(b=>b.textContent.trim()==='Сохранить');
    if(old && !old.dataset.k32Bound){
      const btn=old.cloneNode(true);
      btn.type='button';btn.removeAttribute('onclick');btn.dataset.k32Bound='1';
      btn.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();saveAnime();});
      old.replaceWith(btn);
    }
  }

  // One final openAdmin: renders admin view and then installs UI in that exact DOM.
  window.openAdmin=async function(){
    try{
      const ok=await isAdmin();
      if(!ok){showToast('Нет доступа к админ-панели');return;}
      const profile=$('profile-modal');
      const box=profile?.querySelector('.profile-content');
      if(!profile||!box)return;

      profile.classList.remove('hidden');
      profile.classList.add('k-admin-open');
      box.innerHTML=`
        <div class="k12-admin-shell">
          <button type="button" class="k12-back" onclick="closeAdmin()">← Назад в профиль</button>
          <div class="k12-title">Админ-панель KUROSHI</div>
          <div class="k12-sub">Управление аниме, сериями, новостями и уведомлениями.</div>
          <div id="admin-status"></div>
          <div class="k10-admin-tabs">
            <button data-k10-tab="anime" class="active" onclick="k10Tab('anime')">🎬 Аниме</button>
            <button data-k10-tab="episodes" onclick="k10Tab('episodes')">📺 Серии</button>
            <button data-k10-tab="news" onclick="k10Tab('news')">📰 Новости</button>
            <button data-k10-tab="users" onclick="k10Tab('users')">👥 Пользователи</button>
          </div>
          <div class="k10-panel active" id="k10-anime">
            <div class="admin-grid" style="margin-top:18px">
              <div class="admin-card">
                <h3>🎬 Аниме</h3>
                <input id="admin-anime-id" class="field-input" placeholder="ID, например midnight-blade">
                <input id="admin-anime-title" class="field-input" placeholder="Название">
                <input id="admin-anime-genre" class="field-input" placeholder="Жанр">
                <input id="admin-anime-year" class="field-input" type="number" placeholder="Год">
                <input id="admin-anime-status" class="field-input" placeholder="Статус">
                <input id="admin-anime-poster" class="field-input" placeholder="URL постера">
                <input id="admin-anime-description" class="field-input" placeholder="Описание">
                <div class="admin-row"><button type="button" class="btn-primary">Сохранить</button></div>
              </div>
              <div class="admin-card">
                <h3>📺 Серия</h3>
                <input id="admin-ep-anime" class="field-input" placeholder="ID аниме">
                <input id="admin-ep-number" class="field-input" type="number" placeholder="Номер серии">
                <input id="admin-ep-title" class="field-input" placeholder="Название серии">
                <input id="admin-ep-video" class="field-input" placeholder="URL видео">
                <button class="btn-primary" type="button" onclick="adminSaveEpisode()">Сохранить серию</button>
              </div>
            </div>
          </div>
          <div class="k10-panel" id="k10-episodes"></div>
          <div class="k10-panel" id="k10-news"></div>
          <div class="k10-panel" id="k10-users"></div>
        </div>`;
      installAdminUI();
      // Existing tab functionality may populate other tabs; keep anime usable regardless.
    }catch(e){
      console.error(e);
      showToast('Не удалось открыть админ-панель');
    }
  };

  window.closeAdmin=function(){
    const profile=$('profile-modal');
    if(!profile)return;
    profile.classList.remove('k-admin-open');
    if(typeof renderProfileModal==='function')renderProfileModal('library');
  };
})();
</script>
</body>
</html>
